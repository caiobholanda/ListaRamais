name: Debug Secret (temporário)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checar secrets
        run: |
          echo "FLY_API_TOKEN (repo): tamanho=${#FLY}"
          echo "CLAUDE_CODE_OAUTH_TOKEN (org): tamanho=${#CLAUDE}"
        env:
          FLY: ${{ secrets.FLY_API_TOKEN }}
          CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
