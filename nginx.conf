server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS/JSX: sem hash no nome — usar must-revalidate + ETag
    # para que browser nao fique preso em versao antiga apos deploy.
    # 'immutable' aqui causava cache eterno (browser nunca buscava
    # update mesmo apos novo deploy, ignorando o ?v=... do HTML).
    location ~* \.(js|jsx|css)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        etag on;
    }

    # Imagens/fonts: cache de 1 ano e' OK (raramente mudam).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
