<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gran Marquise · Lista de Contatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body);
    font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
    transition: background var(--dur-slow) var(--ease), color var(--dur-slow) var(--ease);
  }
  .gm-header, .gm-search, .gm-chip, .gm-row, .gm-section__rule, .gm-toggle { transition:
    background var(--dur-slow) var(--ease), color var(--dur-slow) var(--ease),
    border-color var(--dur-slow) var(--ease); }
  ::selection { background: var(--accent); color: var(--on-ink); }
  a { color: inherit; text-decoration: none; }
  em { font-style: italic; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; border-radius: 2px; }

  /* ---------------- Header ---------------- */
  .gm-header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .gm-header__inner {
    max-width: 1120px; margin: 0 auto; padding: 18px clamp(20px, 4vw, 48px);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .gm-header__right { display: flex; align-items: center; gap: clamp(16px, 3vw, 28px); }

  /* ---------------- Logo ---------------- */
  .gm-logo { display: flex; align-items: center; gap: 14px; color: var(--fg); }
  .gm-logo__mono {
    font-family: var(--font-display); font-optical-sizing: auto;
    font-style: italic; font-weight: 400; font-size: 30px; line-height: 1;
    color: var(--accent); letter-spacing: -0.02em;
  }
  .gm-logo__rule { width: 1px; height: 38px; background: var(--line-strong); flex: none; }
  .gm-logo__words { display: flex; flex-direction: column; line-height: 1.05; }
  .gm-logo__pre {
    font-family: var(--font-mono); font-weight: 500; font-size: 9.5px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 3px;
  }
  .gm-logo__name {
    font-family: var(--font-display); font-optical-sizing: auto;
    font-weight: 400; font-size: 22px; letter-spacing: 0.005em; color: var(--fg);
  }
  .gm-logo__tag {
    font-family: var(--font-mono); font-weight: 400; font-size: 9.5px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-soft); margin-top: 4px;
  }
  @media (max-width: 460px) { .gm-logo__name { font-size: 18px; } .gm-logo__mono { font-size: 25px; } }

  /* ---------------- Status ---------------- */
  .gm-status { display: inline-flex; align-items: center; gap: 8px; }
  .gm-status__dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--status);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--status) 60%, transparent);
    animation: gm-pulse 2.4s var(--ease) infinite;
  }
  @keyframes gm-pulse {
    0%   { box-shadow: 0 0 0 0   color-mix(in srgb, var(--status) 55%, transparent); }
    70%  { box-shadow: 0 0 0 6px transparent; }
    100% { box-shadow: 0 0 0 0   transparent; }
  }
  .gm-status__txt {
    font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-xs);
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--status);
  }
  @media (max-width: 620px) { .gm-status__txt { display: none; } }

  /* ---------------- Theme toggle ---------------- */
  .gm-toggle {
    display: inline-flex; align-items: center; gap: 2px; padding: 4px;
    border: 1px solid var(--line-strong); border-radius: var(--r-pill);
    background: transparent; cursor: pointer;
  }
  .gm-toggle__ic {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    color: var(--fg-soft); transition: all var(--dur) var(--ease);
  }
  .gm-toggle__ic svg { width: 16px; height: 16px; }
  .gm-toggle__ic.is-on { background: var(--accent); color: var(--on-ink); }

  /* ---------------- Main ---------------- */
  .gm-main { max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 48px); }

  /* ---------------- Hero ---------------- */
  .gm-hero { text-align: center; padding: clamp(40px, 6vw, 68px) 0 clamp(20px, 3vw, 30px); }
  .gm-eyebrow {
    font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-label);
    letter-spacing: var(--track-label); text-transform: uppercase; color: var(--fg-muted);
    margin-bottom: 24px;
  }

  /* ---------------- Search ---------------- */
  .gm-search {
    display: flex; align-items: center; gap: 14px;
    max-width: 600px; margin: 0 auto;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--r-md); padding: 0 14px 0 20px; height: 58px;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  .gm-search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .gm-search__icon { color: var(--accent); flex: none; display: grid; place-items: center; }
  .gm-search__input {
    flex: 1; border: none; background: none; outline: none; min-width: 0;
    font-family: var(--font-body); font-size: 1.1rem; color: var(--fg); font-weight: 400;
  }
  .gm-search__input::placeholder { color: var(--fg-soft); font-style: italic; }
  .gm-search__input::-webkit-search-cancel-button { display: none; }
  .gm-search__clear {
    flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: transparent; color: var(--fg-muted); display: grid; place-items: center;
    transition: all var(--dur-fast);
  }
  .gm-search__clear:hover { background: var(--accent); color: var(--on-ink); }
  .gm-search__kbd {
    flex: none; font-family: var(--font-mono); font-size: 12px; font-weight: 500;
    color: var(--fg-soft); border: 1px solid var(--line-strong); border-radius: 5px;
    padding: 3px 8px; line-height: 1;
  }
  .gm-hero__count {
    margin-top: 20px; font-family: var(--font-mono); font-size: var(--fs-xs);
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted);
  }
  .gm-hero__count span { color: var(--accent); font-weight: 600; }

  /* ---------------- Sector chips ---------------- */
  .gm-chips {
    padding: 16px 0 18px;
  }
  .gm-chips__rail { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .gm-chip {
    font-family: var(--font-mono); font-weight: 500; font-size: 0.7rem;
    letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
    padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer;
    background: transparent; color: var(--fg-muted); border: 1px solid var(--line);
    transition: all var(--dur-fast) var(--ease);
  }
  .gm-chip:hover { color: var(--fg); border-color: var(--line-strong); }
  .gm-chip.is-active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .gm-chip:disabled { opacity: 0.3; cursor: default; }

  /* ---------------- Section ---------------- */
  .gm-results { padding-bottom: clamp(56px, 9vw, 110px); padding-top: 10px; }
  .gm-section { margin-top: clamp(40px, 5vw, 60px); }
  .gm-section__head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 8px; }
  .gm-section__idx {
    font-family: var(--font-display); font-optical-sizing: auto; font-style: italic;
    font-weight: 300; font-size: 1.5rem; color: var(--accent); flex: none; line-height: 1;
  }
  .gm-section__title {
    font-family: var(--font-display); font-optical-sizing: auto;
    font-weight: 300; font-size: var(--fs-h2); line-height: 1.1; color: var(--fg);
    display: inline-flex; align-items: center; gap: 12px; flex: none;
  }
  .gm-section__title em { font-style: italic; }
  .gm-section__ic { color: var(--fg-muted); display: grid; place-items: center; }
  .gm-section__rule { flex: 1; height: 1px; background: var(--line); align-self: center; }
  .gm-section__count {
    flex: none; font-family: var(--font-mono); font-weight: 500; font-size: var(--fs-xs);
    letter-spacing: 0.12em; color: var(--fg-soft); align-self: center;
  }

  /* ---------------- Grid + Row ---------------- */
  .gm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 0 clamp(28px, 4vw, 52px); }
  .gm-row {
    display: flex; align-items: center; gap: 18px;
    padding: 17px 6px; border-top: 1px solid var(--line);
    transition: background var(--dur-fast) var(--ease);
  }
  .gm-row:hover { background: var(--surface-hover); }
  .gm-row__body { flex: 1; min-width: 0; }
  .gm-row__role {
    font-family: var(--font-display); font-optical-sizing: auto;
    font-weight: 400; font-size: 1.1rem; color: var(--fg); line-height: 1.3; letter-spacing: 0.002em;
    text-wrap: pretty;
  }
  .gm-row__names { margin-top: 4px; font-size: 0.88rem; color: var(--fg-muted); line-height: 1.45; }
  .gm-row__names--empty {
    font-family: var(--font-mono); font-style: normal; font-size: 0.66rem;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-soft); margin-top: 6px;
  }
  .gm-row__ext { flex: none; display: flex; align-items: center; gap: 8px; }
  .gm-num {
    font-family: var(--font-display); font-optical-sizing: auto; font-style: italic;
    font-weight: 400; font-size: var(--fs-ext); color: var(--ext);
    font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap;
    transition: color var(--dur-fast);
  }
  .gm-num--sm { font-size: clamp(1.1rem, 2.2vw, 1.35rem); }
  .gm-row__copy {
    width: 30px; height: 30px; flex: none; border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--fg-soft);
    display: grid; place-items: center; opacity: 0;
    transition: opacity var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
  }
  .gm-row:hover .gm-row__copy, .gm-row:focus-within .gm-row__copy { opacity: 1; }
  .gm-row__copy:hover { color: var(--accent); border-color: var(--line-strong); }
  @media (hover: none) { .gm-row__copy { opacity: 1; } }

  /* Icone do WhatsApp: link <a> ao lado do celular. Mesma familia visual do
     gm-row__copy mas com cor verde WA (#25D366 — mantida em ambos os temas
     pois e' a brand color do WhatsApp). 22x22, opacidade 1 (sempre visivel). */
  .gm-row__wa {
    width: 22px; height: 22px; flex: none; border-radius: var(--r-sm);
    display: inline-grid; place-items: center;
    color: #25D366; text-decoration: none;
    transition: transform var(--dur-fast);
  }
  .gm-row__wa:hover { transform: scale(1.12); color: #128C7E; }

  .gm-mark {
    background: transparent; color: var(--accent); font-weight: 500;
    border-bottom: 1.5px solid var(--accent);
  }

  /* ---------------- Empty ---------------- */
  .gm-empty { text-align: center; padding: clamp(56px, 11vw, 110px) 20px; }
  .gm-empty__icon {
    width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 50%;
    display: grid; place-items: center; color: var(--accent); border: 1px solid var(--line-strong);
  }
  .gm-empty__title {
    font-family: var(--font-display); font-optical-sizing: auto; font-weight: 300;
    font-size: clamp(1.4rem, 3vw, 1.9rem); color: var(--fg); margin-bottom: 10px;
  }
  .gm-empty__title em { color: var(--accent); }
  .gm-empty__sub { color: var(--fg-muted); margin-bottom: 26px; }
  .gm-btn {
    font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 12px 26px; border-radius: var(--r-sm); cursor: pointer; border: none;
    background: var(--fg); color: var(--bg); transition: all var(--dur-fast) var(--ease);
  }
  .gm-btn:hover { background: var(--accent); color: var(--on-ink); }

  @media (max-width: 600px) {
    .gm-grid { grid-template-columns: 1fr; gap: 0; }
    .gm-num { font-size: clamp(1.4rem, 7vw, 1.9rem); }
    .gm-num--sm { font-size: clamp(1rem, 5vw, 1.35rem); }
    .gm-section__head { flex-wrap: wrap; gap: 10px; }
    .gm-section__title { font-size: clamp(1.2rem, 5vw, 1.5rem); }
    .gm-section__rule { display: none; }
    .gm-row { padding: 14px 4px; gap: 14px; }
    .gm-chip { padding: 7px 11px; font-size: 0.65rem; }
    .gm-row__copy { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, .gm-status__dot { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* ── Gear button ── */
  .gm-gear-btn {
    width: 36px; height: 36px; border-radius: var(--r-sm);
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--fg-soft); cursor: pointer; display: grid; place-items: center;
    transition: all var(--dur-fast) var(--ease);
  }
  .gm-gear-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Botao "Modo edicao" — visivel apenas para admin. Toggle com indicacao
     visual (badge accent quando ativo). Atalho de teclado: E. */
  .gm-edit-mode-btn {
    height: 36px; padding: 0 12px; border-radius: var(--r-sm);
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--fg-soft); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    transition: all var(--dur-fast) var(--ease); white-space: nowrap;
  }
  .gm-edit-mode-btn:hover { color: var(--accent); border-color: var(--accent); }
  .gm-edit-mode-btn.is-active {
    background: var(--accent); color: var(--on-ink); border-color: var(--accent);
  }
  @media (max-width: 620px) { .gm-edit-mode-btn__label { display: none; } }

  /* Modo edicao: realce sutil + cursor pointer no card. O lapis fica oculto
     ate o modo ser ativado pelo toggle no header. */
  .gm-row--editavel {
    outline: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
    outline-offset: 2px; border-radius: 4px;
  }
  .gm-row__edit {
    width: 26px; height: 26px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: transparent;
    color: var(--fg-muted); cursor: pointer;
    display: grid; place-items: center; margin-left: 4px;
    transition: all var(--dur-fast) var(--ease);
  }
  .gm-row__edit:hover { color: var(--accent); border-color: var(--accent); }

  /* Botao "Sair" — mesmas dimensoes verticais do gear, mas com texto + icone
     alinhados horizontalmente e centralizados. */
  .gm-sair-btn {
    height: 36px; padding: 0 14px; border-radius: var(--r-sm);
    border: 1px solid var(--line-strong); background: transparent;
    color: var(--fg-soft); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: 500 13px/1 var(--font-sans, system-ui, sans-serif);
    transition: all var(--dur-fast) var(--ease);
  }
  .gm-sair-btn:hover { color: var(--accent); border-color: var(--accent); }
  .gm-sair-btn svg { display: block; }

  /* Padrao Gran Marquise: data + hora no header de todos os sistemas do hub. */
  .gm-datahora {
    font: 500 12px/1 ui-monospace, "JetBrains Mono", Menlo, monospace;
    letter-spacing: .04em; color: var(--fg-soft);
    font-variant-numeric: tabular-nums; white-space: nowrap;
    padding: 0 4px;
  }
  @media (max-width: 560px) { .gm-datahora { display: none; } }

  /* ── Admin panel overlay + slide-in ── */
  .adm-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in srgb, #000 55%, transparent);
    animation: adm-fadein 220ms var(--ease) both;
  }
  .adm-panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 101;
    width: min(92vw, 900px); background: var(--bg);
    border-left: 1px solid var(--line-strong);
    display: flex; flex-direction: column;
    animation: adm-slidein 260ms var(--ease) both;
    box-shadow: -6px 0 32px color-mix(in srgb, #000 18%, transparent);
  }
  @keyframes adm-fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes adm-slidein { from { transform: translateX(100%); } to { transform: translateX(0); } }

  .adm-panel__header {
    display: flex; align-items: center; gap: 12px; padding: 18px 22px;
    border-bottom: 1px solid var(--line); flex: none;
  }
  .adm-title {
    flex: 1; font-family: var(--font-display); font-optical-sizing: auto;
    font-weight: 400; font-size: 1.25rem; color: var(--fg); font-style: italic;
  }
  .adm-close-sm {
    width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line-strong);
    background: transparent; color: var(--fg-muted); cursor: pointer;
    display: grid; place-items: center; transition: all var(--dur-fast) var(--ease);
  }
  .adm-close-sm:hover { color: var(--fg); border-color: var(--fg); }
  .adm-hist-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; border-radius: var(--r-sm);
    background: transparent; color: var(--fg-muted); border: 1px solid var(--line-strong); cursor: pointer;
    transition: all var(--dur-fast) var(--ease);
  }
  .adm-hist-btn:hover { color: var(--fg); border-color: var(--fg); }
  .adm-add-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 8px 14px; border-radius: var(--r-sm);
    background: var(--accent); color: var(--on-ink); border: none; cursor: pointer;
    transition: opacity var(--dur-fast);
  }
  .adm-add-btn:hover { opacity: 0.88; }

  /* ── Toolbar ── */
  .adm-toolbar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .adm-toolbar__search { flex: 1; min-width: 0; width: auto; height: 36px; padding: 7px 12px; font-size: 0.85rem; }
  .adm-toolbar__search::-webkit-search-cancel-button { display: none; }
  .adm-filter-select {
    font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--surface); color: var(--fg); border: 1px solid var(--line-strong);
    border-radius: var(--r-sm); padding: 7px 12px; cursor: pointer;
  }
  .adm-count {
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-soft); margin-left: auto;
  }

  /* ── Admin list ── */
  .adm-list { flex: 1; overflow-y: auto; }
  .adm-list-head {
    display: grid; grid-template-columns: 90px 1fr 1fr 1.2fr 80px 70px 80px;
    padding: 9px 22px; background: var(--surface); border-bottom: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 0.62rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted);
    position: sticky; top: 0; z-index: 2;
  }
  .adm-row {
    display: grid; grid-template-columns: 90px 1fr 1fr 1.2fr 80px 70px 80px;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
    align-items: center; transition: background var(--dur-fast);
  }
  .adm-cell--email { color: var(--fg-muted); font-size: 0.78rem; }
  .adm-cell--email a:hover { color: var(--accent); text-decoration: underline; }

  /* Filtro de status: 3 botoes segmentados que se combinam com setor + texto. */
  .adm-status-group {
    display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    overflow: hidden; flex: none;
  }
  .adm-status-btn {
    padding: 8px 14px; border: none; background: transparent; cursor: pointer;
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted);
    border-right: 1px solid var(--line); transition: all var(--dur-fast);
  }
  .adm-status-btn:last-child { border-right: none; }
  .adm-status-btn:hover { color: var(--fg); background: var(--surface-hover); }
  .adm-status-btn.is-active {
    background: var(--accent); color: var(--on-ink);
  }
  .adm-row:hover { background: var(--surface-hover); }
  .adm-row--off { opacity: 0.45; }

  .adm-cell {
    font-size: 0.82rem; color: var(--fg); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-right: 8px;
  }
  .adm-cell--sec { font-family: var(--font-mono); font-size: 0.68rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .adm-cell--role { font-weight: 500; }
  .adm-cell--names { color: var(--fg-muted); font-size: 0.78rem; }
  .adm-cell--ext { font-family: var(--font-display); font-style: italic; font-size: 1rem; color: var(--ext); }
  .adm-cell--actions { display: flex; align-items: center; gap: 6px; padding-right: 0; }
  .adm-empty { color: var(--fg-soft); font-style: italic; }

  /* ── Badges ── */
  .adm-badge {
    display: inline-flex; align-items: center; padding: 3px 9px;
    border-radius: var(--r-pill); font-family: var(--font-mono);
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .adm-badge--on  { background: color-mix(in srgb, var(--status) 15%, transparent); color: var(--status); }
  .adm-badge--off { background: color-mix(in srgb, var(--fg-soft) 12%, transparent); color: var(--fg-soft); }

  /* ── Action buttons + toggle pill ── */
  .adm-act {
    width: 28px; height: 28px; border-radius: var(--r-sm); border: 1px solid transparent;
    background: transparent; color: var(--fg-muted); cursor: pointer;
    display: grid; place-items: center; transition: all var(--dur-fast);
  }
  .adm-act:hover { color: var(--accent); border-color: var(--line-strong); }
  .adm-act--toggle {
    width: 36px; height: 22px; border-radius: 11px; padding: 0;
    position: relative; border: none;
  }
  .adm-act--toggle .adm-toggle-pill {
    position: absolute; inset: 2px; border-radius: 9px;
    background: var(--line-strong); transition: background var(--dur-fast);
  }
  .adm-act--toggle .adm-toggle-pill::after {
    content: ''; position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
    width: 10px; height: 10px; border-radius: 50%; background: var(--fg-soft);
    transition: left var(--dur-fast), background var(--dur-fast);
  }
  .adm-act--toggle.is-on .adm-toggle-pill { background: color-mix(in srgb, var(--status) 35%, transparent); }
  .adm-act--toggle.is-on .adm-toggle-pill::after { left: calc(100% - 13px); background: var(--status); }

  /* ── Entry form modal ── */
  .adm-modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: color-mix(in srgb, #000 60%, transparent);
    display: grid; place-items: center; padding: 20px;
    animation: adm-fadein 180ms var(--ease) both;
    overscroll-behavior: contain;
  }
  /* Modal escala ate o viewport menos margens. Body rola internamente;
     header e footer ficam fixos (flex 0). Resolve corte em <600px de altura. */
  .adm-modal {
    width: 100%; max-width: 460px; background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    box-shadow: 0 24px 64px color-mix(in srgb, #000 30%, transparent);
    animation: adm-modal-up 220ms var(--ease) both;
    display: flex; flex-direction: column;
    max-height: calc(100dvh - 32px);
  }
  @keyframes adm-modal-up { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .adm-modal__header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    font-family: var(--font-display); font-style: italic; font-size: 1.1rem; font-weight: 400;
  }
  .adm-modal__body {
    flex: 1 1 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 22px; display: flex; flex-direction: column; gap: 6px;
  }
  .adm-modal__footer {
    flex: 0 0 auto;
    padding: 16px 22px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 10px;
  }
  /* Scroll lock global enquanto qualquer overlay esta aberto. JS controla
     a classe via useBodyScrollLock (contador de instancias). */
  body.modal-open { overflow: hidden; }
  .adm-label {
    font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-muted); margin-top: 10px;
  }
  .adm-label:first-child { margin-top: 0; }
  .adm-input {
    width: 100%; padding: 10px 14px; border-radius: var(--r-sm);
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
    font-family: var(--font-body); font-size: 0.92rem;
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
  }
  .adm-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .adm-input::placeholder { color: var(--fg-soft); font-style: italic; }
  .adm-btn {
    font-family: var(--font-mono); font-weight: 500; font-size: 0.68rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    padding: 10px 20px; border-radius: var(--r-sm); border: none; cursor: pointer;
    transition: all var(--dur-fast) var(--ease);
  }
  .adm-btn:disabled { opacity: 0.45; cursor: default; }
  .adm-btn--ghost { background: transparent; color: var(--fg-muted); border: 1px solid var(--line-strong); }
  .adm-btn--ghost:hover:not(:disabled) { color: var(--fg); border-color: var(--fg); }
  .adm-btn--gold { background: var(--accent); color: var(--on-ink); border: 1px solid transparent; }
  .adm-btn--gold:hover:not(:disabled) { opacity: 0.88; }

  @media (max-width: 700px) {
    .adm-panel { width: 100vw; }
    .adm-list-head, .adm-row { grid-template-columns: 70px 1fr 70px 60px 72px; }
    /* Esconde Nomes (3) e E-mail (4) no mobile para nao apertar colunas-chave. */
    .adm-cell--names, .adm-list-head > span:nth-child(3),
    .adm-cell--email, .adm-list-head > span:nth-child(4) { display: none; }
    /* Segmented status: encurta padding/texto. */
    .adm-status-btn { padding: 7px 9px; font-size: 0.6rem; letter-spacing: 0.08em; }
  }

  /* ── History modal ── */
  .adm-modal--hist { max-width: 560px; }
  .adm-hist-filter {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-bottom: 1px solid var(--line); flex: none;
  }
  .adm-hist-date-input { width: 160px; flex: none; font-size: 0.82rem; padding: 7px 10px; }
  .adm-hist-clear-btn { padding: 7px 12px; font-size: 0.65rem; white-space: nowrap; }
  .adm-hist-body { max-height: 420px; overflow-y: auto; overscroll-behavior: contain; }
  .adm-hist-empty { padding: 28px 22px; color: var(--fg-soft); font-size: 0.88rem; font-style: italic; }
  .adm-hist-day-group + .adm-hist-day-group { border-top: 3px double var(--line-strong); }
  .adm-hist-day-header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 12px 22px;
    background: color-mix(in srgb, var(--accent) 10%, var(--bg) 90%);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    font-family: var(--font-display); font-style: italic;
  }
  .adm-hist-day-label {
    font-size: 0.95rem; font-weight: 500; color: var(--fg);
    text-transform: capitalize;
  }
  .adm-hist-day-count {
    font-family: var(--font-mono); font-style: normal;
    font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--fg-muted);
  }
  .adm-hist-item { padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .adm-hist-item:last-child { border-bottom: none; }
  .adm-hist-day-group .adm-hist-item:last-child { border-bottom: 1px solid var(--line); }
  .adm-hist-day-group:last-child .adm-hist-item:last-child { border-bottom: none; }
  .adm-hist-item__head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .adm-hist-badge {
    display: inline-flex; padding: 3px 10px; border-radius: var(--r-pill);
    font-family: var(--font-mono); font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; flex: none;
  }
  .adm-hist-badge--new  { background: color-mix(in srgb, #3b82f6 15%, transparent); color: #3b82f6; }
  .adm-hist-badge--edit { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .adm-hist-badge--on   { background: color-mix(in srgb, var(--status) 15%, transparent); color: var(--status); }
  .adm-hist-badge--off  { background: color-mix(in srgb, var(--fg-soft) 12%, transparent); color: var(--fg-soft); }
  .adm-hist-entry { font-size: 0.82rem; color: var(--fg); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adm-hist-entry em { font-style: italic; color: var(--fg-muted); font-weight: 400; }
  .adm-hist-by { font-size: 0.78rem; color: var(--fg-muted); white-space: nowrap; flex: none; }
  .adm-hist-at { font-family: var(--font-mono); font-size: 0.68rem; color: var(--fg-muted); white-space: nowrap; flex: none; }
  .adm-hist-diff { margin-top: 10px; display: flex; flex-direction: column; gap: 7px; }
  .adm-hist-diff-row { display: flex; align-items: baseline; gap: 8px; font-size: 0.82rem; flex-wrap: wrap; }
  .adm-hist-diff-field { font-family: var(--font-mono); font-size: 0.62rem; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.1em; min-width: 54px; flex: none; }
  .adm-hist-diff-before { color: var(--fg-soft); text-decoration: line-through; }
  .adm-hist-diff-arrow { color: var(--fg-soft); flex: none; }
  .adm-hist-diff-after { color: var(--fg); font-weight: 500; }
  .adm-hist-nodiff { font-size: 0.8rem; color: var(--fg-soft); font-style: italic; }

  /* ── Form errors & toast ── */
  .adm-form-error {
    background: color-mix(in srgb, #dc2626 12%, transparent);
    color: #dc2626; border: 1px solid color-mix(in srgb, #dc2626 35%, transparent);
    border-radius: var(--r-sm); padding: 9px 12px;
    font-size: 0.82rem; margin-bottom: 6px;
  }
  .adm-field-error {
    display: block; color: #dc2626; font-size: 0.72rem;
    font-family: var(--font-mono); letter-spacing: 0.06em;
    margin-top: 4px; margin-bottom: 2px;
  }
  .adm-input--err { border-color: #dc2626; }
  .adm-input--err:focus { box-shadow: 0 0 0 3px color-mix(in srgb, #dc2626 18%, transparent); }
  .adm-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 500; padding: 12px 22px; border-radius: var(--r-pill);
    background: var(--fg); color: var(--bg);
    font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    box-shadow: 0 8px 28px color-mix(in srgb, #000 25%, transparent);
    animation: adm-toast-in 220ms var(--ease) both;
  }
  .adm-toast--app {
    background: #dc2626; color: #fff; z-index: 600;
  }
  @keyframes adm-toast-in { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ── Grupo de Transferência ── */
  .adm-checkbox-row {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 0 14px; margin-bottom: 6px;
    border-bottom: 1px dashed var(--line); cursor: pointer;
  }
  .adm-checkbox-row input[type="checkbox"] {
    width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent);
  }
  .adm-checkbox-row span {
    font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg);
  }
  .adm-grupo-tag {
    display: inline-flex; align-items: center; padding: 3px 9px;
    border-radius: var(--r-pill); font-family: var(--font-mono);
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent);
    white-space: nowrap;
  }
  .gm-row__names--grupo {
    font-family: var(--font-mono); font-style: normal; font-size: 0.66rem;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-top: 6px;
  }

  /* ── Sector combobox ── */
  .adm-combo { position: relative; }
  .adm-combo__drop {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 300;
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    box-shadow: 0 8px 24px color-mix(in srgb, #000 20%, transparent);
    max-height: 220px; overflow-y: auto;
  }
  .adm-combo__opt {
    padding: 9px 14px; font-size: 0.88rem; color: var(--fg); cursor: pointer;
    transition: background var(--dur-fast);
  }
  .adm-combo__opt:hover, .adm-combo__opt.is-active { background: var(--surface-hover); }
  .adm-combo__stale {
    display: block; font-size: 0.72rem; color: var(--fg-soft);
    font-style: italic; margin-top: 4px;
  }
</style>
</head>
<body>
  <!-- Spinner inicial: aparece antes de React montar e some assim que o
       JS substituir o conteudo. Da feedback visual nos primeiros ms entre
       o paint do HTML e o boot do directory.jsx. -->
  <div id="root">
    <div id="gm-boot-spinner" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg,#fafafa);color:var(--fg-soft,#6b6b6b);font-family:ui-monospace,'JetBrains Mono',Menlo,monospace;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase">
      <div style="width:40px;height:40px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:gmSpin .9s linear infinite"></div>
      <div>Carregando diretório…</div>
    </div>
  </div>
  <style>@keyframes gmSpin { to { transform: rotate(360deg); } }</style>

  <!-- React/React-DOM auto-hospedados (eram do unpkg.com — eliminava cold
       start de outro dominio TLS). UMDs identicos aos do CDN, 130 KB. -->
  <script src="/vendor/react.production.min.js" crossorigin="anonymous"></script>
  <script src="/vendor/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
